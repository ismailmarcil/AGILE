<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Test: Tour de livraison</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, Segoe UI, Roboto, Arial; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-top: 0; }
        
        .section { background: white; border-radius: 8px; padding: 18px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-top: 0; margin-bottom: 12px; color: #2c3e50; font-size: 18px; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
        
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
        input[type="file"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 14px; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.success { background: #27ae60; }
        button.success:hover { background: #229954; }
        button.danger { background: #e74c3c; }
        button.danger:hover { background: #c0392b; }
        
        #planPreview, #demandsPreview { border: 1px solid #ddd; padding: 12px; max-height: 200px; overflow-y: auto; border-radius: 4px; background: #fafafa; }
        .step { padding: 8px; border-bottom: 1px solid #eee; }
        .step:last-child { border-bottom: none; }
        .step strong { color: #2c3e50; }
        .small { font-size: 13px; color: #7f8c8d; margin-top: 4px; }
        
        #mapContainer { height: 400px; border: 1px solid #ddd; border-radius: 4px; margin: 12px 0; }
        
        .info-box { background: #ecf0f1; border-left: 4px solid #3498db; padding: 12px; margin: 12px 0; border-radius: 4px; }
        .info-box.warning { border-left-color: #f39c12; background: #fef5e7; }
        .info-box.success { border-left-color: #27ae60; background: #eafaf1; }
        
        /* Tour overlay */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .tour-card { background: white; padding: 24px; border-radius: 8px; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .tour-card h2 { margin: 0 0 12px; font-size: 20px; color: #2c3e50; }
        .tour-card .step-info { font-size: 14px; color: #7f8c8d; margin-bottom: 12px; }
        .tour-card .location { padding: 8px; background: #ecf0f1; border-radius: 4px; margin: 6px 0; }
        .tour-controls { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
        .tour-controls button { padding: 8px 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚚 Planificador de Tours de Entrega</h1>

        <!-- Section 1: Load Plan -->
        <div class="section">
            <h2>1️⃣ Cargar Mapa del Plan</h2>
            <div class="controls">
                <input id="planFileInput" type="file" accept=".xml" />
                <button id="btnLoadPlan">Cargar Mapa</button>
            </div>
            <div id="planPreview"><em>📁 No hay mapa cargado</em></div>
        </div>

        <!-- Section 2: Load Demands -->
        <div class="section">
            <h2>2️⃣ Cargar Demandas de Entrega</h2>
            <div class="controls">
                <input id="demandsFileInput" type="file" accept=".xml" />
                <button id="btnLoadDemands" disabled>Cargar Demandas</button>
                <button id="btnClearDemands" class="danger" disabled>Limpiar</button>
            </div>
            <div id="demandsPreview"><em>📦 No hay demandas cargadas</em></div>
        </div>

        <!-- Section 3: Map Display -->
        <div class="section">
            <h2>🗺️ Visualización del Mapa</h2>
            <div id="mapContainer"></div>
        </div>

        <!-- Section 4: Compute and Display Tour -->
        <div class="section">
            <h2>3️⃣ Crear y Mostrar Tour</h2>
            <div class="controls">
                <button id="btnComputeTour" class="success" disabled>Hacer el Tour</button>
            </div>
            <div id="tourInfo"></div>
        </div>
    </div>

    <!-- Tour overlay -->
    <div id="overlay" class="overlay" role="dialog" aria-modal="true">
        <div class="tour-card" id="tourCard">
            <div class="step-info" id="stepIndex"></div>
            <h2 id="stepTitle"></h2>
            <div id="stepContent"></div>
            <div class="tour-controls">
                <div>
                    <button id="btnPrev">⬅️ Anterior</button>
                    <button id="btnNext">Siguiente ➡️</button>
                </div>
                <button id="btnClose" class="danger">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Backend Scripts -->
    <script src="/backend/demand.js"></script>
    <script src="/backend/node.js"></script>
    <script src="/backend/segment.js"></script>
    <script src="/backend/plan.js"></script>
    <script src="/backend/tours.js"></script>
    <script src="/backend/system.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        let system = new System();
        let currentTourStep = 0;
        let tourSteps = [];
        let map = null;

        const planFileInput = document.getElementById('planFileInput');
        const demandsFileInput = document.getElementById('demandsFileInput');
        const btnLoadPlan = document.getElementById('btnLoadPlan');
        const btnLoadDemands = document.getElementById('btnLoadDemands');
        const btnClearDemands = document.getElementById('btnClearDemands');
        const btnComputeTour = document.getElementById('btnComputeTour');
        const planPreview = document.getElementById('planPreview');
        const demandsPreview = document.getElementById('demandsPreview');
        const tourInfo = document.getElementById('tourInfo');
        const mapContainer = document.getElementById('mapContainer');

        const overlay = document.getElementById('overlay');
        const stepTitle = document.getElementById('stepTitle');
        const stepContent = document.getElementById('stepContent');
        const stepIndex = document.getElementById('stepIndex');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnClose = document.getElementById('btnClose');

        // Initialize map
        function initMap() {
            if (map) {
                map.remove();
            }
            map = L.map('mapContainer').setView([48.8566, 2.3522], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // Load Plan
        btnLoadPlan.addEventListener('click', async () => {
            const file = planFileInput.files[0];
            if (!file) {
                alert('Selecciona un archivo XML de mapa');
                return;
            }
            try {
                const result = await system.loadPlan({ files: [file] });
                if (result.success) {
                    renderPlanPreview();
                    initMap();
                    displayPlanOnMap();
                    btnLoadDemands.disabled = false;
                    showInfo('✅ Mapa cargado correctamente', 'success');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Error al cargar mapa: ' + err.message);
            }
        });

        // Load Demands
        btnLoadDemands.addEventListener('click', async () => {
            const file = demandsFileInput.files[0];
            if (!file) {
                alert('Selecciona un archivo XML de demandas');
                return;
            }
            try {
                const text = await file.text();
                const xmlDoc = new DOMParser().parseFromString(text, 'application/xml');

                // Load warehouse
                const entrepots = xmlDoc.getElementsByTagName('entrepot');
                if (entrepots.length > 0) {
                    const warehouseId = entrepots[0].getAttribute('adresse');
                    if (warehouseId) {
                        const warehouseNode = system.plan.nodes.find(n => n.id === warehouseId);
                        if (warehouseNode) {
                            system.plan.warehouse = warehouseNode;
                        }
                    }
                }

                // Load demands
                const livraisons = xmlDoc.getElementsByTagName('livraison');
                Array.from(livraisons).forEach(node => {
                    const pickup = node.getAttribute('adresseEnlevement');
                    const delivery = node.getAttribute('adresseLivraison');
                    const pickupDur = Number(node.getAttribute('dureeEnlevement')) || 0;
                    const deliveryDur = Number(node.getAttribute('dureeLivraison')) || 0;
                    system.addDemand(pickup, delivery, pickupDur, deliveryDur);
                });

                renderDemandsPreview();
                btnComputeTour.disabled = false;
                btnClearDemands.disabled = false;
                showInfo(`✅ ${system.demandsList.length} demandas cargadas correctamente`, 'success');
            } catch (err) {
                alert('Error al cargar demandas: ' + err.message);
            }
        });

        // Clear Demands
        btnClearDemands.addEventListener('click', () => {
            system.demandsList = [];
            system.toursList = [];
            demandsPreview.innerHTML = '<em>📦 No hay demandas cargadas</em>';
            tourInfo.innerHTML = '';
            btnComputeTour.disabled = true;
            btnClearDemands.disabled = true;
            showInfo('Demandas eliminadas', 'warning');
        });

        // Compute Tour
        btnComputeTour.addEventListener('click', () => {
            if (!system.plan || !system.plan.warehouse) {
                alert('Falta cargar el mapa o no hay entrepôt');
                return;
            }
            if (system.demandsList.length === 0) {
                alert('No hay demandas cargadas');
                return;
            }

            const courier = { id: 'courier_1', name: 'Livreur 1' };
            const tours = system.computeTours([courier]);

            if (tours.length === 0) {
                alert('Error al crear el tour');
                return;
            }

            buildTourSteps(tours[0]);
            showInfo(`✅ Tour créé avec ${tourSteps.length} étapes`, 'success');
            currentTourStep = 0;
            showStep();
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });

        // Tour controls
        btnPrev.addEventListener('click', () => {
            if (currentTourStep > 0) {
                currentTourStep--;
                showStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentTourStep < tourSteps.length - 1) {
                currentTourStep++;
                showStep();
            } else {
                endTour();
            }
        });

        btnClose.addEventListener('click', endTour);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) endTour();
        });

        function buildTourSteps(tour) {
            tourSteps = [];
            tourSteps.push({
                title: '🏪 Inicio - Entrepôt',
                location: system.plan.warehouse.id,
                text: 'Départ du tour de livraison'
            });

            if (tour.stops && tour.stops.length > 0) {
                tour.stops.forEach((stop, i) => {
                    tourSteps.push({
                        title: `📍 Étape ${i + 1}`,
                        location: stop.id,
                        text: `Arrivée: ${stop.arrivalTime || 'N/A'}\nDépart: ${stop.departureTime || 'N/A'}`
                    });
                });
            }

            tourSteps.push({
                title: '✅ Fin - Retour à l\'entrepôt',
                location: system.plan.warehouse.id,
                text: `Distance totale: ${(tour.totalDistance || 0).toFixed(2)} km`
            });
        }

        function showStep() {
            if (tourSteps.length === 0) return;
            const step = tourSteps[currentTourStep];
            stepTitle.textContent = step.title;
            stepContent.innerHTML = `<div class="location"><strong>Point:</strong> ${step.location}</div><div>${step.text}</div>`;
            stepIndex.textContent = `Étape ${currentTourStep + 1} de ${tourSteps.length}`;
            btnPrev.disabled = currentTourStep === 0;
            btnNext.textContent = currentTourStep === tourSteps.length - 1 ? 'Terminer' : 'Suivant ➡️';
        }

        function endTour() {
            overlay.style.display = 'none';
            document.body.style.overflow = '';
        }

        function renderPlanPreview() {
            if (!system.plan || !system.plan.nodes || system.plan.nodes.size === 0) {
                planPreview.innerHTML = '<em>📁 No hay nodos en el plan</em>';
                return;
            }
            planPreview.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'step';
            div.innerHTML = `<strong>Nodos: ${system.plan.nodes.size}</strong><div class="small">Segmentos: ${system.plan.segments ? system.plan.segments.length : 0}</div>`;
            planPreview.appendChild(div);
        }

        function renderDemandsPreview() {
            if (system.demandsList.length === 0) {
                demandsPreview.innerHTML = '<em>📦 No hay demandas</em>';
                return;
            }
            demandsPreview.innerHTML = '';
            system.demandsList.slice(0, 5).forEach((d, i) => {
                const div = document.createElement('div');
                div.className = 'step';
                div.innerHTML = `<strong>${i + 1}. Recogida ${d.pickupAddress} → Entrega ${d.deliveryAddress}</strong>`;
                demandsPreview.appendChild(div);
            });
            if (system.demandsList.length > 5) {
                const div = document.createElement('div');
                div.className = 'step';
                div.innerHTML = `<em>... y ${system.demandsList.length - 5} más</em>`;
                demandsPreview.appendChild(div);
            }
        }

        function displayPlanOnMap() {
            if (!map || !system.plan || !system.plan.nodes) return;
            
            // Convert nodes Map to Array
            const nodes = Array.from(system.plan.nodes.values());
            
            // Draw nodes
            nodes.forEach(node => {
                L.circleMarker([node.latitude, node.longitude], {
                    radius: 4,
                    fillColor: '#3498db',
                    color: '#fff',
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.8
                }).addTo(map).bindPopup(`Nodo: ${node.id}`);
            });

            // Draw segments
            if (system.plan.segments) {
                system.plan.segments.forEach(seg => {
                    if (seg.origin && seg.destination) {
                        L.polyline([
                            [seg.origin.latitude, seg.origin.longitude],
                            [seg.destination.latitude, seg.destination.longitude]
                        ], { color: '#95a5a6', weight: 2, opacity: 0.6 }).addTo(map);
                    }
                });
            }

            // Highlight warehouse
            if (system.plan.warehouse) {
                L.circleMarker([system.plan.warehouse.latitude, system.plan.warehouse.longitude], {
                    radius: 8,
                    fillColor: '#27ae60',
                    color: '#fff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map).bindPopup(`Entrepôt: ${system.plan.warehouse.id}`);
            }

            // Fit map bounds
            if (nodes.length > 0) {
                const bounds = nodes.map(n => [n.latitude, n.longitude]);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function showInfo(message, type = 'info') {
            tourInfo.innerHTML = `<div class="info-box ${type === 'success' ? 'success' : type === 'warning' ? 'warning' : ''}">${message}</div>`;
        }

        // Initialize on load
        initMap();
    </script>
</body>
</html>
