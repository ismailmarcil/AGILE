<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Test DisplayPlan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #map {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>🗺️ Test : Affichage du Plan</h1>
    <div class="controls">
        <button onclick="loadPlan()">Afficher le plan</button>
        <button onclick="view.clearMap()">Effacer la carte</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/backend/node.js"></script>
    <script src="/backend/segment.js"></script>
    <script src="/script/view.js"></script>

    <script>
        let view = new View("08:00", "map");

        async function loadPlan() {
            console.log("Loading plan...");

            // Load XML via server
            const response = await fetch("/fichiersXMLPickupDelivery/petitPlan.xml");
            const xmlText = await response.text();

            // Parse XML
            const xmlDoc = new DOMParser().parseFromString(xmlText, "application/xml");

            // Load nodes
            const xmlNodes = Array.from(xmlDoc.getElementsByTagName("noeud"));
            const nodes = xmlNodes.map(n => new Node(
                n.getAttribute("id"),
                parseFloat(n.getAttribute("latitude")),
                parseFloat(n.getAttribute("longitude")),
                []
            ));

            const nodeMap = new Map(nodes.map(n => [n.id, n]));

            // Load segments
            const xmlSegments = Array.from(xmlDoc.getElementsByTagName("troncon"));
            const segments = xmlSegments.map(s => {
                const originNode = nodeMap.get(s.getAttribute("origine"));
                const destNode = nodeMap.get(s.getAttribute("destination"));

                const seg = new Segment(
                    originNode,
                    destNode,
                    s.getAttribute("nomRue"),
                    parseFloat(s.getAttribute("longueur"))
                );

                if (originNode) {
                    originNode.segments.push(seg);
                }
                return seg;
            });

            // Build JSON for display
            const planJSON = {
                nodes: nodes.map(n => n.toJSON()),
                segments: segments.map(s => s.toJSON())
            };

            // Display plan
            view.displayPlan(planJSON);
            console.log("Plan displayed!");
        }
    </script>
</body>

</html>
