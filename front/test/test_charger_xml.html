<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Test DisplayPlan</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #map {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🗺️ Test : Affichage du Plan (DisplayPlan)</h1>

    <div class="controls">
        <input type="file" id="xmlFileInput" accept=".xml" />
        <button onclick="loadPlan()">Afficher le plan</button>
        <button onclick="displayPlan.clearMap()">Effacer la carte</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Backend classes -->
    <script src="../../backend/Node.js"></script>
    <script src="../../backend/Segment.js"></script>

    <!-- DisplayPlan class -->
    <script src="../scripts/displayPlan.js"></script>

    <script>
        // Instance DisplayPlan
        let displayPlan = new DisplayPlan("map");

        async function loadPlan() {
            console.log("Chargement du plan...");

            const fileInput = document.getElementById("xmlFileInput");

            // 1. Vérifier qu'un fichier est sélectionné
            if (fileInput.files.length === 0) {
                alert("❌ Aucun fichier sélectionné. Veuillez choisir un fichier XML.");
                return;
            }

            const file = fileInput.files[0];

            // 2. Vérifier l'extension et le type MIME
            const fileName = file.name.toLowerCase();
            const isXmlExtension = fileName.endsWith(".xml");
            const isXmlMime = file.type === "text/xml" || file.type === "application/xml" || file.type === "";

            if (!isXmlExtension && !isXmlMime) {
                alert("Le fichier sélectionné n'est pas un fichier XML.");
                return;
            }

            // 3. Lire le contenu du fichier
            let text;
            try {
                text = await file.text();
            } catch (error) {
                console.error("Erreur de lecture du fichier :", error);
                alert("Impossible de lire le fichier. Vérifiez qu'il n'est pas corrompu.");
                return;
            }

            // 4. Parser le XML
            const xmlDoc = new DOMParser().parseFromString(text, "application/xml");

            // Vérifier les erreurs de parsing
            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                alert("Le contenu du fichier XML est invalide ou mal formé.");
                return;
            }

            const reseau = xmlDoc.getElementsByTagName("reseau")[0];
            const noeuds = xmlDoc.getElementsByTagName("noeud");
            const troncons = xmlDoc.getElementsByTagName("troncon");

            if (!reseau) {
                alert("❌ Le XML ne contient pas la balise <reseau>. Ce n'est pas un plan valide.");
                return;
            }

            if (noeuds.length === 0) {
                alert("❌ Aucun noeud trouvé dans le XML. Ce fichier ne correspond pas à un plan.");
                return;
            }

            if (troncons.length === 0) {
                alert("❌ Aucun troncon trouvé dans le XML. Ce fichier ne correspond pas à un plan.");
                return;
            }

            // Validación de atributos esenciales
            let estructuraValida = true;

            for (let n of noeuds) {
                if (!n.getAttribute("id") || !n.getAttribute("latitude") || !n.getAttribute("longitude")) {
                    estructuraValida = false;
                    console.log(n);
                    break;
                }
            }

            for (let t of troncons) {
                if (!t.getAttribute("origine") || !t.getAttribute("destination") || !t.getAttribute("longueur")) {
                    estructuraValida = false;
                    console.log(t);
                    break;
                }
            }

            if (!estructuraValida) {
                alert("❌ Le XML n'a pas la structure d'un plan de carte (noeud/ troncon incorrects).");
                return;
            }
        

            // Charger les noeuds
            const xmlNodes = Array.from(xmlDoc.getElementsByTagName("noeud"));
            const nodes = xmlNodes.map(n => new Node(
                n.getAttribute("id"),
                parseFloat(n.getAttribute("latitude")),
                parseFloat(n.getAttribute("longitude")),
                [] 
            ));

            const nodeMap = new Map(nodes.map(n => [n.id, n]));

            // Charger les segments
            const xmlSegments = Array.from(xmlDoc.getElementsByTagName("troncon"));
            const segments = xmlSegments.map(s => {
                const seg = new Segment(
                    s.getAttribute("origine"),
                    s.getAttribute("destination"),
                    s.getAttribute("nomRue"),
                    parseFloat(s.getAttribute("longueur"))
                );
                // Ajouter le segment au noeud d'origine
                if (nodeMap.has(seg.origin)) {
                    nodeMap.get(seg.origin).segments.push(seg);
                }
                return seg;
            });

            // Construire JSON compatible avec DisplayPlan
            const planJSON = {
                nodes: nodes.map(n => n.toJSON()),
                segments: segments.map(s => s.toJSON())
            };

            // Affichage du plan
            displayPlan.displayPlan(planJSON);

            console.log("Plan affiché !");
        }

    </script>

</body>
</html>
